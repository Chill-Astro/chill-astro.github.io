<body class="modern-snake-page">
    <div class="snake-orientation-prompt" role="status" aria-live="polite" aria-label="Rotate your phone to portrait to play">
        <div class="snake-orientation-prompt-content">
            <div class="snake-orientation-visual" aria-hidden="true">
                <svg class="snake-orientation-arrows" viewBox="0 0 160 140">
                    <g transform="translate(160 0) scale(-1 1)">
                        <path d="M47 95c-18-12-18-38 0-50m66 0c18 12 18 38 0 50"/>
                        <path d="M37 43 47 45 45 55m70 30-2 10 10 2"/>
                    </g>
                </svg>
                <svg class="snake-orientation-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="1" width="14" height="22" rx="3"></rect>
                    <path d="M10 19.5h4"></path>
                </svg>
            </div>
            <p>Rotate your phone to portrait to play.</p>
        </div>
    </div>
    <div id="header"></div>

    <main class="snake-main">
        <section class="snake-intro" aria-labelledby="snake-title">
            <h1 id="snake-title">Modern Snake</h1>
            <p>Guide the snake through the grid. Eat the apples and keep growing.</p>
        </section>

        <div class="snake-play-layout">
        <section class="snake-game" id="snake-game" data-phase="ready" aria-label="Modern Snake game">
            <div class="snake-topbar">
                <div class="snake-stats" aria-label="Game score">
                    <div class="snake-stat-row"><span>SCORE :</span><output id="snake-score">0</output></div>
                    <div class="snake-stat-row"><span>BEST :</span><output id="snake-best">0</output></div>
                </div>
                <div class="snake-actions" aria-label="Game controls">
                    <button class="site-button site-button--primary" id="snake-pause" type="button" disabled hidden>Pause</button>
                    <button class="site-button site-button--primary" id="snake-restart" type="button" hidden>Restart</button>
                    <button class="site-button site-button--primary" id="snake-end" type="button" disabled hidden>End</button>
                </div>
            </div>

            <div class="snake-board-shell" id="snake-board-shell">
                <canvas id="snake-board" width="600" height="600" role="img" aria-label="Snake game board. Use arrow keys or WASD to move, or swipe on the board."></canvas>
                <div class="snake-state-overlay" id="snake-overlay" aria-labelledby="snake-overlay-title" aria-describedby="snake-overlay-description">
                    <div class="snake-state-dialog">
                        <h2 id="snake-overlay-title">Ready to play?</h2>
                        <p id="snake-overlay-description">Eat the apples and avoid the edges. Use the direction buttons, arrow keys, or WASD.</p>
                        <button class="site-button site-button--primary snake-overlay-action" id="snake-overlay-action" type="button">Start game</button>
                    </div>
                </div>
            </div>

        </section>

        <aside class="snake-controls-panel" aria-label="Snake movement controls">
            <div class="snake-controls-grid">
                <div class="snake-control-slot snake-control-up">
                    <button class="touch-button site-button site-button--primary snake-touch-button" type="button" data-direction="up" aria-label="Move up"><span class="touch-button-icon" aria-hidden="true">▲</span><span class="touch-button-label" aria-hidden="true">UP</span></button>
                </div>
                <div class="snake-control-slot snake-control-left">
                    <button class="touch-button site-button site-button--primary snake-touch-button" type="button" data-direction="left" aria-label="Move left"><span class="touch-button-icon" aria-hidden="true">◀</span><span class="touch-button-label" aria-hidden="true">LEFT</span></button>
                </div>
                <div class="snake-control-slot snake-control-down">
                    <button class="touch-button site-button site-button--primary snake-touch-button" type="button" data-direction="down" aria-label="Move down"><span class="touch-button-icon" aria-hidden="true">▼</span><span class="touch-button-label" aria-hidden="true">DOWN</span></button>
                </div>
                <div class="snake-control-slot snake-control-right">
                    <button class="touch-button site-button site-button--primary snake-touch-button" type="button" data-direction="right" aria-label="Move right"><span class="touch-button-icon" aria-hidden="true">▶</span><span class="touch-button-label" aria-hidden="true">RIGHT</span></button>
                </div>
            </div>
        </aside>
        </div>
    </main>

    <div id="footer"></div>
