<body class="dino-page">
    <div class="orientation-prompt" role="status" aria-live="polite" aria-label="Rotate your phone to landscape to play">
        <div class="orientation-prompt-content">
            <div class="orientation-visual" aria-hidden="true">
                <svg class="orientation-arrows" viewBox="0 0 160 140">
                    <path class="orientation-arrow" d="M47 95c-18-12-18-38 0-50m66 0c18 12 18 38 0 50"/>
                    <path class="orientation-arrow-head" d="M37 43 47 45 45 55m70 30-2 10 10 2"/>
                </svg>
                <svg class="orientation-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="1" width="14" height="22" rx="3"></rect>
                    <path d="M10 19.5h4"></path>
                </svg>
            </div>
            <p>Rotate your phone to landscape to play.</p>
        </div>
    </div>
    <div id="header"></div>
    <main class="dino-main">
        <section class="dino-intro" aria-labelledby="dino-title">
            <h1 id="dino-title">Premium Dino</h1>
            <p>Ah the Classic Game! How far can you go?</p>
        </section>
        <section class="dino-game" id="dino-game" data-phase="ready" aria-label="Premium Dino game">
          <div class="dino-stage">
            <aside class="dino-controls" aria-label="Game controls">
                <div class="fullscreen-controls dino-control-pair" aria-label="Touch and keyboard controls">
                    <div class="touch-controls dino-touch-controls">
                        <button class="touch-button dino-touch-button site-button site-button--primary" id="jump-button" type="button" aria-label="Jump"><span class="touch-button-icon" aria-hidden="true">▲</span><span class="touch-button-label" aria-hidden="true">JUMP</span></button>
                        <button class="touch-button dino-touch-button site-button site-button--primary" id="duck-button" type="button" aria-label="Duck"><span class="touch-button-icon" aria-hidden="true">▼</span><span class="touch-button-label" aria-hidden="true">DUCK</span></button>
                    </div>
                    <div class="fullscreen-key-hints dino-key-hints" aria-label="Keyboard controls">
                        <kbd aria-label="W key to jump">W</kbd>
                        <kbd aria-label="S key to duck">S</kbd>
                    </div>
                </div>
            </aside>
            <div class="dino-court-column">
                <div class="dino-frame">
                    <canvas id="dino-canvas" width="960" height="420" role="img" aria-label="Dino runner game. Jump over cacti and duck under birds.">Your browser does not support canvas.</canvas>
                    <div class="dino-stats" aria-label="Game score">
                        <div class="dino-stat-row dino-score-row"><span class="dino-label">SCORE :</span><output id="dino-score">00000</output></div>
                        <div class="dino-stat-row dino-best-row"><span class="dino-label">BEST :</span><output id="dino-best">00000</output></div>
                    </div>
                    <div class="dino-overlay" id="dino-overlay">
                        <p class="dino-overlay-title" id="overlay-title">Ready to run?</p>
                        <p class="dino-overlay-message" id="overlay-message">Jump over cacti and duck under birds.</p>
                        <button class="primary-btn" id="start-game" type="button" disabled>Start game</button>
                    </div>
                    <div class="dino-actions" id="dino-actions" aria-label="Game actions">
                        <button class="dino-action primary-btn" id="pause-game" type="button" hidden>Pause</button>
                        <button class="dino-action primary-btn" id="restart-game" type="button" hidden>Restart</button>
                        <button class="dino-action dino-action-end primary-btn" id="end-game" type="button" hidden>End</button>
                    </div>
                    <button class="dino-fullscreen game-fullscreen-button" id="fullscreen-game" type="button" aria-label="Enter fullscreen" aria-pressed="false">⛶</button>
                </div>
                <p class="dino-attribution"><a href="https://github.com/loparcog/chrome-dinosaur" target="_blank" rel="noopener noreferrer">T-Rex Runner</a>: Chromium Authors · <a href="../assets/t-rex-runner/LICENSE" target="_blank" rel="noopener noreferrer">BSD 3-Clause</a></p>
            </div>
          </div>
        </section>
    </main>
    <div id="footer"></div>
