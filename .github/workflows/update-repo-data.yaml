name: Update Repo Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate repo-data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/data

          get_release() {
            repo="$1"

            curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Chill-Astro/$repo/releases/latest"
          }

          LAMINA=$(get_release "Lamina-Calculator")
          ROOT=$(get_release "FOSS-Root-Checker")
          TMM=$(get_release "Trust-My-Msix")

          cat > assets/data/repo-data.json <<EOF
          {
            "generated":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",

            "lamina":{
              "tag":$(echo "$LAMINA" | jq '.tag_name'),
              "asset":$(echo "$LAMINA" | jq '.assets[0].name'),
              "download":$(echo "$LAMINA" | jq '.assets[0].browser_download_url')
            },

            "rootChecker":{
              "tag":$(echo "$ROOT" | jq '.tag_name'),
              "asset":$(echo "$ROOT" | jq '.assets[0].name'),
              "download":$(echo "$ROOT" | jq '.assets[0].browser_download_url')
            },

            "trustMyMsix":{
              "tag":$(echo "$TMM" | jq '.tag_name'),
              "asset":$(echo "$TMM" | jq '.assets[0].name'),
              "download":$(echo "$TMM" | jq '.assets[0].browser_download_url')
            }
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/repo-data.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update repo-data.json"

          git push