    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Play Modern Snake and Tic Tac Toe Online, two free browser games from Chill-Astro. Jump into classic arcade gameplay directly in your browser.">

    <meta property="og:site_name" content="Chill-Astro Software">
    <meta property="og:title" content="Free Browser Games: Snake &amp; Tic-Tac-Toe | Chill-Astro">

    <meta property="og:image:alt" content="Modern Snake monochrome game board with a white apple">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Free Browser Games: Snake &amp; Tic-Tac-Toe | Chill-Astro">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Mini Games",
      "url": "https://chill-astro.github.io/mini-games/",
      "description": "Play Modern Snake and Tic Tac Toe Online, two free browser games from Chill-Astro. Jump into classic arcade gameplay directly in your browser.",
      "isPartOf": {
        "@type": "WebSite",
        "name": "Chill-Astro Software",
        "url": "https://chill-astro.github.io/"
      },
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Modern Snake", "url": "https://chill-astro.github.io/modern-snake/" },
          { "@type": "ListItem", "position": 2, "name": "Tic Tac Toe Online", "url": "https://chill-astro.github.io/tic-tac-toe/" }
        ]
      }
    }
    </script>
    <link rel="icon" type="image/webp" href="../assets/images/tabicon.webp">
    <link rel="stylesheet" href="../css/style.css?interface=125">
    <link rel="stylesheet" href="../css/game-centre.css?v=2">
    <title>Free Browser Games: Snake &amp; Tic-Tac-Toe | Chill-Astro</title>
</head>
<body>
    <div id="header"></div>
    <main class="game-centre-page">
        <header class="game-centre-heading">            
            <h1>Mini Games</h1>
        </header>

        <div class="game-showcase-list">
        <section class="game-showcase game-showcase-card" aria-labelledby="snake-title">
            <h2 class="game-title" id="snake-title">Modern Snake</h2>
            <div class="game-info">
                <div class="game-logo-frame"><img class="game-logo" src="../assets/images/modern-snake-icon.webp" alt="Modern Snake game icon" width="512" height="512" loading="lazy" decoding="async"></div>
                <a class="primary-btn game-centre-play site-button site-button--primary" href="/modern-snake/">Play <span aria-hidden="true">▶</span></a>
                <p class="game-description">A Recreation of the Classic Snake Game with a Modern Look!</p>
            </div>
            <div class="game-preview"><img src="../assets/images/modern-snake-preview.webp" alt="Modern Snake gameplay preview" width="1600" height="900" loading="lazy" decoding="async"></div>
        </section>

        <section class="game-showcase game-showcase-card" aria-labelledby="ttt-title">
            <h2 class="game-title" id="ttt-title">Tic Tac Toe Online</h2>
            <div class="game-info">
                <div class="game-logo-frame"><img class="game-logo" src="../assets/images/tic-tac-toe.webp" alt="Tic Tac Toe Online logo" width="512" height="512" loading="lazy" decoding="async"></div>
                <a class="primary-btn game-centre-play site-button site-button--primary" href="/tic-tac-toe/">Play <span aria-hidden="true">▶</span></a>
                <p class="game-description">Play against your Friend on 4x4. Or Beat the AI if you can in GOD MODE 5x5 Grid!</p>
            </div>
            <div class="game-preview"><img src="../assets/images/tic-tac-toe-preview.webp" alt="Tic Tac Toe Online gameplay preview" width="1920" height="1080" loading="lazy" decoding="async"></div>
        </section>
        </div>
    </main>
    <div id="footer"></div>
    <script src="../js/main.js?effects=13"></script>
    <script src="../js/site-settings.js?settings=8"></script>
</body>
</html>
