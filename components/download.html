<!-- ======================================
     Download Modal
====================================== -->

<div
    class="download-overlay"
    id="downloadOverlay">

    <div class="download-dialog">

        <div class="dialog-header">

            <h2 id="downloadTitle"></h2>

            <button
                class="dialog-close"
                id="downloadClose">

                ✕

            </button>

        </div>

        <div class="dialog-body">

            <div
                class="dialog-version"
                id="downloadVersion">

            </div>

            <p
                id="downloadInfo">

            </p>

            <pre
                id="downloadCommand"
                class="download-command">

            </pre>

            <div
                class="dialog-links"
                id="downloadLinks">

            </div>

        </div>

    </div>

</div>
